const NL=[{t:'Isim, fi‘il, dan huruf',s:'Jenis kata dalam bahasa Arab',b:'Kata Arab terbagi tiga: isim (kata benda atau sifat), fi‘il (kata kerja), dan huruf. Semua Asmaul Husna adalah isim. Ciri isim: dapat ber-alif-lam (الـ), bertanwin, dan dapat didahului huruf jar. Contoh: الرَّحْمَنُ، الْعَلِيمُ، الْخَالِقُ.'},{t:'Alif-lam dan ma‘rifah',s:'Mengapa nama Allah ber-alif-lam',b:'Alif-lam (الـ) membuat isim menjadi ma‘rifah (tertentu). Isim tanpa alif-lam dan tanwin dapat berupa nakirah (umum). Hampir semua Asmaul Husna ber-alif-lam karena merujuk kepada Allah secara khusus. Pengecualian: bentuk idhafah seperti مَالِكُ الْمُلْكِ dan ذُو الْجَلَالِ.'},{t:'I‘rab: marfu‘, manshub, majrur',s:'Perubahan harakat akhir kata',b:'I‘rab adalah perubahan harakat akhir kata menurut kedudukannya. Marfu‘ ditandai dhammah, manshub fathah, dan majrur kasrah. Contoh: هُوَ الرَّحْمَنُ (marfu‘ sebagai khabar) dan بِسْمِ اللَّهِ الرَّحْمَٰنِ (majrur sebagai na‘at).'},{t:'Jumlah ismiyyah',s:'Mubtada dan khabar',b:'Kalimat yang diawali isim disebut jumlah ismiyyah: mubtada (pokok) dan khabar (keterangan), keduanya marfu‘. Contoh: هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ (QS. Al-Hasyr: 24). Nama-nama sesudah lafzh Allah berfungsi sebagai khabar atau na‘at sehingga marfu‘. Ulama nahwu membolehkan lebih dari satu analisis.'},{t:'Na‘at dan man‘ut',s:'Sifat mengikuti yang disifati',b:'Na‘at (sifat) mengikuti man‘ut (yang disifati) dalam i‘rab, ma‘rifah atau nakirah, jenis, dan jumlah. Contoh susunan: اللَّهُ الْعَزِيزُ الْحَكِيمُ. “الْعَزِيزُ” dan “الْحَكِيمُ” mengikuti lafzh Allah: sama-sama marfu‘, ma‘rifah, mudzakkar, dan mufrad.'},{t:'Idhafah',s:'Mudhaf dan mudhaf ilaih',b:'Idhafah adalah gabungan dua isim: mudhaf (kata pertama) dan mudhaf ilaih (kata kedua). Mudhaf tidak boleh ber-alif-lam atau bertanwin, dan mudhaf ilaih selalu majrur. Contoh: مَالِكُ الْمُلْكِ. Kata ذُو termasuk asmaul khamsah: marfu‘ dengan waw (ذُو), manshub dengan alif (ذَا), majrur dengan ya (ذِي).'},{t:'Huruf jar dan na‘at berurutan',s:'Basmalah sebagai contoh',b:'Setelah huruf jar, isim menjadi majrur, dan na‘at-nya ikut majrur. Contoh: بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ. “الرَّحْمَٰنِ” dan “الرَّحِيمِ” adalah na‘at yang majrur mengikuti lafzh “اللَّهِ”.'}];

NL.push({t:'Khabar lebih dari satu',s:'Dua sifat berurutan',b:'Mubtada boleh memiliki lebih dari satu khabar, semuanya marfu‘. Contoh: وَهُوَ الْغَفُورُ الْوَدُودُ (QS. Al-Buruj: 14). “هُوَ” mubtada, sedangkan “الْغَفُورُ” dan “الْوَدُودُ” dua khabar marfu‘. Sebagian ulama menganalisis yang kedua sebagai na‘at.'},{t:'Inna dan saudaranya',s:'Isim manshub, khabar marfu‘',b:'Huruf إِنَّ menashabkan mubtada (disebut isim inna) dan merafa‘kan khabar. Contoh: إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ (QS. Al-Baqarah: 20). “اللَّهَ” isim inna manshub (fathah), “قَدِيرٌ” khabar inna marfu‘ bertanwin. Saudara inna: أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ.'},{t:'Kāna dan saudaranya',s:'Isim marfu‘, khabar manshub',b:'Kebalikan inna: كَانَ merafa‘kan isim dan menashabkan khabar. Contoh: وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا (QS. Al-Kahf: 45). “اللَّهُ” isim kāna marfu‘, “مُّقْتَدِرًا” khabar kāna manshub bertanwin fathah. Contoh lain: إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا (QS. An-Nisa’: 1).'},{t:'Lam penegas pada khabar inna',s:'Penegasan dengan huruf lam',b:'Lam (لَ) boleh masuk pada khabar inna untuk menegaskan makna. Contoh: وَإِنِّي لَغَفَّارٌ (QS. Thaha: 82). “إِنِّي” adalah inna dan ya mutakallim, sedangkan “لَغَفَّارٌ” khabar inna marfu‘ yang diawali lam penegas. Penegasan ini selaras dengan makna mubalaghah pada pola فَعَّال.'},{t:'Na‘at, khabar, dan badal',s:'Rangkaian nama dalam ayat',b:'Dalam rangkaian nama Allah, kedudukan tiap nama ditentukan oleh kalimatnya. Pada الرَّحْمَٰنِ الرَّحِيمِ (QS. Al-Fatihah: 3), keduanya majrur sebagai na‘at bagi lafzh “اللَّهِ” sebelumnya. Pada اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ (QS. Al-Baqarah: 255), “الْحَيُّ الْقَيُّومُ” marfu‘ sebagai khabar atau na‘at, dan ulama nahwu juga menyebut kemungkinan badal.'},{t:'Huruf jar dan majrur',s:'Bi, li, fi, ‘ala, min',b:'Huruf jar seperti بِ، لِ، فِي، عَلَىٰ، مِنْ menjadikan isim sesudahnya majrur. Contoh dari dalil: بِكُلِّ شَيْءٍ (QS. Al-Baqarah: 29), عَلَىٰ كُلِّ شَيْءٍ (QS. Al-Baqarah: 20), لِمَنْ تَابَ (QS. Thaha: 82). Kata كُلّ majrur oleh huruf jar, dan شَيْءٍ majrur sebagai mudhaf ilaih.'},{t:'Tanwin: nakirah dan ma‘rifah',s:'عَلِيمٌ atau الْعَلِيمُ',b:'Khabar sering berbentuk nakirah (bertanwin) karena menjelaskan sifat dalam kalimat, contoh: وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ (QS. Al-Baqarah: 29). Sebagai nama, ia dibawa dengan alif-lam: الْعَلِيمُ. Keduanya bermakna sama pada dasarnya; perbedaannya ada pada kedudukan dalam kalimat, yaitu sifat dalam kalimat dibanding nama yang dikenal.'});
SL.push({t:'Fi‘il tsulatsi mujarrad: enam bab',s:'Pola madhi dan mudhari‘',b:'Fi‘il tiga huruf tanpa imbuhan memiliki enam pola menurut harakat ‘ain fi‘il madhi dan mudhari‘: فَعَلَ يَفْعُلُ (نَصَرَ يَنْصُرُ)، فَعَلَ يَفْعِلُ (ضَرَبَ يَضْرِبُ)، فَعَلَ يَفْعَلُ (فَتَحَ يَفْتَحُ)، فَعِلَ يَفْعَلُ (عَلِمَ يَعْلَمُ)، فَعُلَ يَفْعُلُ (كَرُمَ يَكْرُمُ)، فَعِلَ يَفْعِلُ (حَسِبَ يَحْسِبُ). Dari فَتَحَ lahir الْفَتَّاح, dari عَلِمَ lahir الْعَلِيم, dan dari كَرُمَ lahir الْكَرِيم.'},{t:'Tashrif lengkap',s:'Tabel madhi sampai isim maf‘ul',b:'Tashrif adalah perubahan satu fi‘il menjadi bentuk-bentuk turunannya. Tabel berikut memuat sembilan akar yang melahirkan Asmaul Husna. Geser tabel ke samping bila terpotong.',e:()=>tbl(['Madhi','Mudhari‘','Amr','Mashdar','Fa‘il','Maf‘ul','Nama'],TS)},{t:'Fi‘il mazid dan isim fa‘ilnya',s:'Pola dengan imbuhan',b:'Fi‘il mazid memiliki huruf tambahan. Isim fa‘ilnya mengikuti pola mudhari‘ dengan mim berdhammah menggantikan huruf mudhara‘ah, dan huruf sebelum akhir dikasrah, misalnya يُعِزُّ menjadi مُعِزٌّ.',e:()=>tbl(['Pola','Madhi','Mudhari‘','Mashdar','Fa‘il','Nama'],TM)},{t:'Mashdar: bentuk dan makna',s:'Kata dasar perbuatan',b:'Mashdar adalah kata dasar yang menunjukkan perbuatan. Pada fi‘il tsulatsi bentuknya banyak dan dihafal (sima‘i), contoh: رَحْمَةٌ، عِلْمٌ، خَلْقٌ، رِزْقٌ، غُفْرَانٌ، مَغْفِرَةٌ. Pada fi‘il mazid bentuknya mengikuti qiyas, contoh: إِفْعَالٌ (إِيمَانٌ)، تَفْعِيلٌ (تَصْوِيرٌ)، اِفْتِعَالٌ (اقْتِدَارٌ). Beberapa Asmaul Husna sendiri berbentuk mashdar, seperti السَّلَام، الْعَدْل، dan النُّور.'},{t:'Satu akar, banyak pola',s:'Pola mengubah penekanan makna',b:'Dari akar غ-ف-ر: غَافِر (pelaku), غَفُور (sangat pengampun), dan غَفَّار (pengampun berulang-ulang). Dari ع-ل-م: عَالِم (yang mengetahui), عَلِيم (pengetahuan yang melekat), dan عَلَّام (sangat berpengetahuan). Dari ق-د-ر: قَادِر (berkuasa), قَدِير (kuasa yang melekat), dan مُقْتَدِر (berkuasa penuh). Pola yang dipilih menunjukkan penekanan yang berbeda, bukan sekadar variasi bunyi.'});
